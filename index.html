<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caja Móvil + Calc Pro</title>
    
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f8f9fa;
            --text: #202124;
            --text-secondary: #5f6368;
            --decimal-bg: #e8f0fe;
        }

        /* Aplicación global de Outfit */
        * { 
            box-sizing: border-box; 
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            overflow: hidden; 
            position: fixed;
            width: 100vw;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-bottom: 30px;
        }

        .header h1 { text-align: center; font-weight: 800; font-size: 1.8em; color: var(--primary); margin: 10px 0; }

        .input-group { display: flex; flex-direction: column; gap: 5px; position: relative; }
        label { font-weight: 600; font-size: 0.9em; color: var(--text-secondary); margin-left: 5px; }
        
        input {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            outline: none;
        }
        input.tasa-input { background-color: #e8f0fe; color: var(--primary); font-weight: 600; border-color: #d2e3fc; }

        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }

        .btn-calc-trigger {
            position: absolute;
            right: 8px;
            top: 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            z-index: 5;
            cursor: pointer;
        }

        /* MODAL CALCULADORA */
        #modalCalc {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: flex-end;
        }

        .ios-calc {
            width: 90%;
            max-width: 350px;
            height: 100%;
            background: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #modalCalc.active .ios-calc { transform: translateX(0); }

        .calc-display {
            color: white;
            font-size: 50px;
            font-weight: 300;
            text-align: right;
            padding: 10px;
            min-height: 90px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .calc-display::-webkit-scrollbar { display: none; }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

        .calc-btn {
            height: 68px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: brightness 0.2s;
        }
        .calc-btn:active { filter: brightness(1.5); }

        .btn-num { background: #333; color: white; }
        .btn-op { background: #ff9f0a; color: white; font-size: 28px; }
        .btn-fn { background: #a5a5a5; color: black; }
        
        .btn-import {
            grid-column: span 4;
            background: var(--primary);
            color: white;
            border-radius: 16px;
            height: 60px;
            font-size: 18px;
            font-weight: 700;
            margin-top: 10px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* RESULTADOS PRINCIPALES */
        .results-container { margin-top: 10px; border-top: 1px solid #eee; padding-top: 15px; }
        .result-row { display: flex; justify-content: space-between; padding: 10px 0; align-items: center; }
        .result-label { color: var(--text-secondary); font-weight: 400; }
        .result-value { font-weight: 700; font-size: 1.4em; color: var(--text); }
        
        .decimal-box { background: var(--decimal-bg); padding: 20px; border-radius: 16px; text-align: center; }
        .decimal-value { font-size: 1.8em; font-weight: 800; color: #000; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header"><h1>Calculadora Móvil</h1></div>

    <div class="input-group">
        <label>TASA DEL DÍA (Bs/$)</label>
        <input type="number" id="tasa" class="tasa-input" inputmode="decimal" placeholder="0.00">
    </div>

    <div class="row">
        <div class="input-group">
            <label>Consumo en $</label>
            <input type="number" id="precioUSD" inputmode="decimal" placeholder="0.00">
        </div>
        <div class="input-group">
            <label>Consumo en Bs</label>
            <button class="btn-calc-trigger" onclick="openCalc()">
                <i class="fas fa-calculator"></i>
            </button>
            <input type="number" id="precioBS" inputmode="decimal" placeholder="0.00">
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">

    <div class="input-group">
        <label>¿CON CUÁNTO PAGA? ($)</label>
        <input type="number" id="pagoCliente" inputmode="decimal" placeholder="Ej: 20">
    </div>

    <div class="results-container">
        <div class="result-row">
            <span class="result-label">Vuelto Total USD</span>
            <span id="vueltoUSD" class="result-value">0.00 $</span>
        </div>
        <div class="result-row">
            <span class="result-label">Vuelto Total BS</span>
            <span id="vueltoBS" class="result-value">0,00 Bs</span>
        </div>
    </div>

    <div class="decimal-box">
        <span style="font-size:0.85em; font-weight:600; color: #1a73e8; text-transform: uppercase;">
            Vuelto de <b id="labelDinamico" style="text-decoration:underline;">0.00</b>$ en Bs:
        </span>
        <div id="soloDecimalesBS" class="decimal-value">0,00 Bs</div>
    </div>
</div>

<!-- Modal Calculadora -->
<div id="modalCalc" onclick="closeCalcOutside(event)">
    <div class="ios-calc" onclick="event.stopPropagation()">
        <div class="calc-display" id="display">0</div>
        <div class="calc-grid">
            <button class="calc-btn btn-fn" onclick="clearCalc()">AC</button>
            <button class="calc-btn btn-fn" onclick="closeCalc()">✕</button>
            <button class="calc-btn btn-fn" onclick="appendOp('/')">÷</button>
            <button class="calc-btn btn-op" onclick="appendOp('*')">×</button>
            
            <button class="calc-btn btn-num" onclick="appendNum('7')">7</button>
            <button class="calc-btn btn-num" onclick="appendNum('8')">8</button>
            <button class="calc-btn btn-num" onclick="appendNum('9')">9</button>
            <button class="calc-btn btn-op" onclick="appendOp('-')">−</button>
            
            <button class="calc-btn btn-num" onclick="appendNum('4')">4</button>
            <button class="calc-btn btn-num" onclick="appendNum('5')">5</button>
            <button class="calc-btn btn-num" onclick="appendNum('6')">6</button>
            <button class="calc-btn btn-op" onclick="appendOp('+')">+</button>
            
            <button class="calc-btn btn-num" onclick="appendNum('1')">1</button>
            <button class="calc-btn btn-num" onclick="appendNum('2')">2</button>
            <button class="calc-btn btn-num" onclick="appendNum('3')">3</button>
            <button class="calc-btn btn-op" onclick="calculateResult()">=</button>
            
            <button class="calc-btn btn-num" style="grid-column: span 2; border-radius: 40px;" onclick="appendNum('0')">0</button>
            <button class="calc-btn btn-num" onclick="appendNum('.')">.</button>
            <button class="calc-btn btn-num" onclick="deleteLast()"><i class="fas fa-backspace"></i></button>

            <button class="btn-import" onclick="importValue()">Importar a Consumo Bs</button>
        </div>
    </div>
</div>

<script>
    const inputTasa = document.getElementById('tasa');
    const inputPrecioUSD = document.getElementById('precioUSD');
    const inputPrecioBS = document.getElementById('precioBS');
    const inputPago = document.getElementById('pagoCliente');
    const display = document.getElementById('display');
    const modal = document.getElementById('modalCalc');

    let currentExpression = '';

    // LÓGICA CALCULADORA
    function openCalc() {
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeCalc() {
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 300);
    }

    function closeCalcOutside(e) { if(e.target === modal) closeCalc(); }

    function updateDisplay() {
        display.innerText = currentExpression || '0';
        display.scrollLeft = display.scrollWidth; // Desplazamiento automático a la izquierda
    }

    function appendNum(n) {
        if (currentExpression === '0') currentExpression = '';
        currentExpression += n;
        updateDisplay();
    }

    function appendOp(op) {
        if (currentExpression === '' || isNaN(currentExpression.slice(-1))) return;
        currentExpression += op;
        updateDisplay();
    }

    function deleteLast() {
        currentExpression = currentExpression.slice(0, -1);
        updateDisplay();
    }

    function clearCalc() {
        currentExpression = '';
        updateDisplay();
    }

    function calculateResult() {
        try {
            let res = eval(currentExpression);
            currentExpression = String(parseFloat(res.toFixed(2)));
            updateDisplay();
        } catch {
            display.innerText = 'Error';
            setTimeout(clearCalc, 800);
        }
    }

    function importValue() {
        if (currentExpression !== '' && !isNaN(currentExpression)) {
            inputPrecioBS.value = currentExpression;
            inputPrecioBS.dispatchEvent(new Event('input'));
            closeCalc();
        }
    }

    // LÓGICA DE NEGOCIO
    inputTasa.addEventListener('input', () => {
        localStorage.setItem('tasaDolar', inputTasa.value);
        calcularTodo();
    });

    inputPrecioUSD.addEventListener('input', function() {
        const tasa = parseFloat(inputTasa.value) || 0;
        if (this.value && tasa > 0) inputPrecioBS.value = (parseFloat(this.value) * tasa).toFixed(2);
        calcularTodo();
    });

    inputPrecioBS.addEventListener('input', function() {
        const tasa = parseFloat(inputTasa.value) || 0;
        if (this.value && tasa > 0) inputPrecioUSD.value = (parseFloat(this.value) / tasa).toFixed(2);
        calcularTodo();
    });

    inputPago.addEventListener('input', calcularTodo);

    function calcularTodo() {
        const tasa = parseFloat(inputTasa.value) || 0;
        const precioUSD = parseFloat(inputPrecioUSD.value) || 0;
        const pagoUSD = parseFloat(inputPago.value) || 0;

        if (tasa <= 0 || !inputPrecioUSD.value || !inputPago.value) {
            actualizarPantalla(0, 0, 0, 0);
            return;
        }

        if (pagoUSD >= precioUSD) {
            const vUSD = pagoUSD - precioUSD;
            const vBS = vUSD * tasa;
            const decUSD = vUSD - Math.floor(vUSD);
            const decBS = (Math.round(decUSD * 100) / 100) * tasa;
            actualizarPantalla(vUSD, vBS, decUSD, decBS);
        } else {
            document.getElementById('vueltoUSD').innerText = "Falta dinero";
            document.getElementById('vueltoBS').innerText = "---";
        }
    }

    function actualizarPantalla(usd, bs, decUSD, decBs) {
        document.getElementById('vueltoUSD').innerText = usd.toFixed(2) + " $";
        document.getElementById('vueltoBS').innerText = bs.toLocaleString('es-VE', {minimumFractionDigits:2}) + " Bs";
        document.getElementById('labelDinamico').innerText = (Math.round(decUSD * 100) / 100).toFixed(2);
        document.getElementById('soloDecimalesBS').innerText = decBs.toLocaleString('es-VE', {minimumFractionDigits:2}) + " Bs";
    }

    window.onload = () => {
        if (localStorage.getItem('tasaDolar')) inputTasa.value = localStorage.getItem('tasaDolar');
    };
</script>

</body>
</html>
