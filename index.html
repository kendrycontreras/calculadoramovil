<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caja Móvil</title>
    
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1011/1011532.png">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f8f9fa;
            --text: #202124;
            --text-secondary: #5f6368;
            --card-bg: #ffffff;
            --highlight-bg: #e8f0fe;
            --decimal-text: #000;
            --decimal-bg: #e8f0fe;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            overflow-x: hidden; 
            position: fixed;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-bottom: 80px; /* Espacio para el botón flotante */
        }

        .header {
            text-align: center;
            padding: 5px 0;
        }

        .header h1 {
            margin: 0;
            font-weight: 800;
            font-size: 1.6em;
            color: var(--primary);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-weight: 600;
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-left: 5px;
        }

        input {
            font-family: 'Outfit', sans-serif;
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            box-sizing: border-box;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }

        input.tasa-input {
            background-color: var(--highlight-bg);
            color: var(--primary);
            font-weight: 700;
            border-color: #d2e3fc;
        }

        .row {
            display: flex;
            gap: 10px;
        }
        .row .input-group {
            flex: 1;
        }

        hr {
            border: 0;
            border-top: 1px solid #e0e0e0;
            margin: 8px 0;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 5px;
        }

        .result-label {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 0.95em;
        }

        .result-value {
            font-weight: 600;
            font-size: 1.3em;
            color: var(--text);
        }

        .decimal-box {
            background-color: var(--decimal-bg);
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            margin-top: 5px;
        }

        .decimal-label {
            color: var(--decimal-text);
            font-weight: 600;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }

        .decimal-value {
            font-size: 1.7em;
            font-weight: 800;
            color: #000;
        }

        #labelDinamico {
            font-weight: 800;
            text-decoration: underline;
        }

        /* AJUSTES DE CALCULADORA MÓVIL */
        #calc-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.4);
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calc-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        .calc-content {
            background: #171717;
            padding: 20px;
            border-radius: 28px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .calc-display {
            background: transparent;
            color: white;
            font-size: 2.2em;
            text-align: right;
            padding: 15px 5px;
            margin-bottom: 10px;
            word-wrap: break-word;
            min-height: 50px;
            font-weight: 400;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            transition: opacity 0.1s;
        }

        .calc-btn:active { opacity: 0.7; }

        .btn-num { background: #333333; color: white; }
        .btn-op { background: #f29900; color: white; }
        .btn-util { background: #a5a5a5; color: black; }
        
        .btn-paste {
            grid-column: span 4;
            aspect-ratio: auto;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            margin-top: 10px;
            padding: 15px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Calculadora Móvil</h1>
    </div>

    <div class="input-group">
        <label for="tasa">TASA DEL DÍA (Bs/$)</label>
        <input type="number" id="tasa" class="tasa-input" pattern="[0-9]*" inputmode="decimal" step="any" placeholder="0.00">
    </div>

    <div class="row">
        <div class="input-group">
            <label for="precioUSD">Consumo en $</label>
            <input type="number" id="precioUSD" pattern="[0-9]*" inputmode="decimal" step="any" placeholder="0.00">
        </div>
        <div class="input-group">
            <label for="precioBS">Consumo en Bs</label>
            <input type="number" id="precioBS" pattern="[0-9]*" inputmode="decimal" step="any" placeholder="0.00">
        </div>
    </div>

    <hr>

    <div class="input-group">
        <label for="pagoCliente">¿CON CUÁNTO PAGA? ($)</label>
        <input type="number" id="pagoCliente" pattern="[0-9]*" inputmode="decimal" step="any" placeholder="Ej: 10, 20, 50">
    </div>

    <div class="results-container">
        <div class="result-row">
            <span class="result-label">Vuelto Total USD</span>
            <span id="vueltoUSD" class="result-value">0.00 $</span>
        </div>
        <div class="result-row">
            <span class="result-label">Vuelto Total BS</span>
            <span id="vueltoBS" class="result-value">0,00 Bs</span>
        </div>
    </div>

    <div class="decimal-box">
        <span class="decimal-label">Vuelto de <span id="labelDinamico">0.00</span>$ en Bolívares:</span>
        <div id="soloDecimalesBS" class="decimal-value">0,00 Bs</div>
    </div>
</div>

<button id="calc-toggle">＋</button>

<div class="calc-modal" id="calc-modal">
    <div class="calc-content">
        <div class="calc-display" id="calc-display">0</div>
        <div class="calc-grid">
            <button class="calc-btn btn-util" onclick="clearCalc()">AC</button>
            <button class="calc-btn btn-util" onclick="deleteLast()">⌫</button>
            <button class="calc-btn btn-util" onclick="addChar('/')">÷</button>
            <button class="calc-btn btn-op" onclick="addChar('*')">×</button>
            
            <button class="calc-btn btn-num" onclick="addChar('7')">7</button>
            <button class="calc-btn btn-num" onclick="addChar('8')">8</button>
            <button class="calc-btn btn-num" onclick="addChar('9')">9</button>
            <button class="calc-btn btn-op" onclick="addChar('-')">−</button>
            
            <button class="calc-btn btn-num" onclick="addChar('4')">4</button>
            <button class="calc-btn btn-num" onclick="addChar('5')">5</button>
            <button class="calc-btn btn-num" onclick="addChar('6')">6</button>
            <button class="calc-btn btn-op" onclick="addChar('+')">+</button>
            
            <button class="calc-btn btn-num" onclick="addChar('1')">1</button>
            <button class="calc-btn btn-num" onclick="addChar('2')">2</button>
            <button class="calc-btn btn-num" onclick="addChar('3')">3</button>
            <button class="calc-btn btn-op" onclick="calculateResult()">=</button>
            
            <button class="calc-btn btn-num" style="grid-column: span 2; border-radius: 40px; aspect-ratio: auto;" onclick="addChar('0')">0</button>
            <button class="calc-btn btn-num" onclick="addChar('.')">.</button>
            <button class="calc-btn btn-util" onclick="closeCalc()">✖</button>

            <button class="calc-btn btn-paste" onclick="pasteResult()">Pegar en Bs</button>
        </div>
    </div>
</div>

<script>
    // Registro del Service Worker[cite: 1]
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registrado'))
                .catch(err => console.log('Error al registrar SW', err));
        });
    }

    const inputTasa = document.getElementById('tasa');
    const inputPrecioUSD = document.getElementById('precioUSD');
    const inputPrecioBS = document.getElementById('precioBS');
    const inputPago = document.getElementById('pagoCliente');
    
    const outputVueltoUSD = document.getElementById('vueltoUSD');
    const outputVueltoBS = document.getElementById('vueltoBS');
    const outputLabelDinamico = document.getElementById('labelDinamico');
    const outputSoloDecimalesBS = document.getElementById('soloDecimalesBS');

    window.onload = function() {
        const tasaGuardada = localStorage.getItem('tasaDolar');
        if (tasaGuardada) {
            inputTasa.value = tasaGuardada;
        }
    };

    inputTasa.addEventListener('input', function() {
        localStorage.setItem('tasaDolar', this.value);
        calcularTodo();
    });

    inputPrecioUSD.addEventListener('input', function() {
        const tasa = parseFloat(inputTasa.value) || 0;
        const usd = parseFloat(this.value);
        if (usd && tasa > 0) {
            inputPrecioBS.value = (usd * tasa).toFixed(2);
        } else if (this.value === "") {
            inputPrecioBS.value = "";
        }
        calcularTodo();
    });

    inputPrecioBS.addEventListener('input', function() {
        const tasa = parseFloat(inputTasa.value) || 0;
        const bs = parseFloat(this.value);
        if (bs && tasa > 0) {
            inputPrecioUSD.value = (bs / tasa).toFixed(2);
        } else if (this.value === "") {
            inputPrecioUSD.value = "";
        }
        calcularTodo();
    });

    inputPago.addEventListener('input', calcularTodo);

    function calcularTodo() {
        const tasa = parseFloat(inputTasa.value) || 0;
        const precioUSD = parseFloat(inputPrecioUSD.value) || 0;
        const pagoUSD = parseFloat(inputPago.value) || 0;

        if (tasa <= 0 || inputPrecioUSD.value === "" || inputPago.value === "") {
            actualizarPantalla(0, 0, 0, 0);
            return;
        }

        if (pagoUSD >= precioUSD) {
            const vueltoTotalUSD = pagoUSD - precioUSD;
            const vueltoTotalBS = vueltoTotalUSD * tasa;
            
            const decimalesUSD = vueltoTotalUSD - Math.floor(vueltoTotalUSD);
            const decimalesRedondeados = Math.round(decimalesUSD * 100) / 100;
            const decimalesEnBS = decimalesRedondeados * tasa;

            actualizarPantalla(vueltoTotalUSD, vueltoTotalBS, decimalesRedondeados, decimalesEnBS);
        } else {
            outputVueltoUSD.innerText = "Falta dinero";
            outputVueltoUSD.style.color = "red";
            outputVueltoBS.innerText = "---";
            outputLabelDinamico.innerText = "0.00";
            outputSoloDecimalesBS.innerText = "0,00 Bs";
        }
    }

    function actualizarPantalla(usd, bs, decUSD, decBs) {
        outputVueltoUSD.style.color = "var(--text)";
        outputVueltoUSD.innerText = usd.toFixed(2) + " $";

        const formatoBS = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
        
        outputVueltoBS.innerText = bs.toLocaleString('es-VE', formatoBS) + " Bs";
        outputLabelDinamico.innerText = decUSD.toFixed(2);
        outputSoloDecimalesBS.innerText = decBs.toLocaleString('es-VE', formatoBS) + " Bs";
    }

    // LÓGICA CALCULADORA TÁCTIL[cite: 1]
    const modal = document.getElementById('calc-modal');
    const display = document.getElementById('calc-display');
    const btnToggle = document.getElementById('calc-toggle');

    btnToggle.onclick = () => modal.style.display = 'flex';
    
    function closeCalc() { modal.style.display = 'none'; }
    
    function addChar(char) {
        if (display.innerText === '0' && char !== '.') display.innerText = char;
        else display.innerText += char;
    }

    function clearCalc() { display.innerText = '0'; }
    
    function deleteLast() {
        if (display.innerText.length > 1) display.innerText = display.innerText.slice(0, -1);
        else display.innerText = '0';
    }

    function calculateResult() {
        try {
            // Reemplazo simple para evaluar matemáticas básicas[cite: 1]
            let expression = display.innerText.replace(/×/g, '*').replace(/÷/g, '/');
            let result = eval(expression);
            display.innerText = Number.isInteger(result) ? result : result.toFixed(2);
        } catch {
            display.innerText = "Error";
        }
    }

    function pasteResult() {
        calculateResult();
        const val = parseFloat(display.innerText);
        if (!isNaN(val)) {
            inputPrecioBS.value = val.toFixed(2);
            inputPrecioBS.dispatchEvent(new Event('input'));
            closeCalc();
        }
    }
</script>

</body>
</html>
